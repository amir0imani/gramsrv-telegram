name: Build Kuark Android

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع بیلد'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore Git Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Native C++/NDK Build
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj_App/.cxx
            TMessagesProj_App/build/intermediates/cxx
          key: cxx-arm64-${{ inputs.build_type || 'Release' }}-${{ hashFiles('TMessagesProj/jni/**', '**/CMakeLists.txt') }}
          restore-keys: |
            cxx-arm64-${{ inputs.build_type || 'Release' }}-

      - name: Setup Android SDK & Licenses
        run: |
          ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager | head -n 1)
          fi
          yes | $SDKMANAGER --licenses || true

      - name: Configure Gradle Memory & Cache
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5120m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties

      - name: Build arm64-v8a APK
        run: |
          chmod +x gradlew
          BUILD_TASK="assembleAfat${{ inputs.build_type || 'Release' }}"
          echo "Running ./gradlew $BUILD_TASK"
          ./gradlew "$BUILD_TASK" -PabiList=arm64-v8a --no-daemon --stacktrace

      - name: Find APK files
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuark-arm64-v8a-${{ inputs.build_type || 'Release' }}
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
