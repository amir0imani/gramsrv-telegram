name: Build Kuark Android

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Gradle & Environment
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "android.injected.build.abi=arm64-v8a" >> ~/.gradle/gradle.properties

      # ایجاد خودکار فایل کلید امضا که تلگرام در مرحله 151 لنگ آن نباشد
      - name: Create Keystore & Config Directory
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Kuark,O=Kuark,C=US" || true

      # بیلد نهایی بدون بررسی‌های اضافه
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug -x lint --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuark-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
